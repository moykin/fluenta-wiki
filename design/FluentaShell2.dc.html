<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="fluenta-mobile.css">
<style>
html,body{margin:0;padding:0;background:#FAFAF8}
.fl-tabbar-in{grid-template-columns:repeat(6,1fr) !important}
.fl-tab{font-size:9.5px !important;gap:2px !important}
a{color:#4F46E5;text-decoration:none}a:hover{color:#4338CA}
</style>
</helmet>
<div style="font-family:Inter,system-ui,sans-serif;color:#1A1A1A">
<header style="position:fixed;top:0;left:0;right:0;height:58px;z-index:50;background:rgba(250,250,248,.97);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid #ECECE8;user-select:none">
  <div style="display:flex;align-items:center;gap:14px;height:58px;padding:0 clamp(14px,2.5vw,28px)">
    <a href="Fluenta Library v2.dc.html" title="fluenta.wiki — в библиотеку" style="display:flex;align-items:center;gap:9px;flex:none;text-decoration:none;color:#1A1A1A">
      <span style="width:26px;height:26px;border-radius:8px;background:#4F46E5;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;font-family:'Source Serif 4',serif">f</span>
      <span class="fsh-wordmark" style="font-family:'Source Serif 4',serif;font-size:17px;font-weight:600;letter-spacing:-.01em">fluenta.wiki</span>
    </a>
    <nav class="fsh-nav" aria-label="Основные разделы" style="display:flex;align-items:stretch;gap:2px;height:58px;margin-left:4px">
      <a class="fsh-item {{ onLibrary }}" href="Fluenta Library v2.dc.html">Библиотека</a>
      <a class="fsh-item {{ onReader }}" href="Fluenta Reader.dc.html">Читалка</a>
      <a class="fsh-item {{ onVideo }}" href="Fluenta Video.dc.html">Видео</a>
      <a class="fsh-item {{ onTutor }}" href="Fluenta Tutor.dc.html">Тьютор</a>
      <a class="fsh-item {{ onReview }}" href="Fluenta Review.dc.html">Повторение<sc-if value="{{ hasDue }}" hint-placeholder-val="{{ false }}"><span title="Карточек ждёт повторения сегодня" style="margin-left:7px;font-size:10.5px;font-weight:600;color:#4338CA;background:#EEF2FF;border:1px solid #E0E7FF;border-radius:999px;padding:1px 6px;line-height:1.4">{{ due }}</span></sc-if></a>
      <a class="fsh-item {{ onCareer }}" href="Fluenta Career.dc.html">Карьера</a>
      <a class="fsh-item {{ onProgress }}" href="Fluenta Progress.dc.html">Прогресс</a>
      <a class="fsh-item {{ onProfile }}" href="Fluenta Profile.dc.html">Профиль</a>
    </nav>
    <div style="flex:1"></div>
    <sc-if value="{{ hasTitle }}" hint-placeholder-val="{{ true }}">
      <div class="fsh-title" style="display:flex;align-items:center;gap:8px;min-width:0;max-width:340px">
        <span style="font-size:13.5px;font-weight:600;color:#1A1A1A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ pageTitle }}</span>
        <sc-if value="{{ hasBadge }}" hint-placeholder-val="{{ false }}"><span style="flex:none;font-size:11px;font-weight:600;letter-spacing:.04em;color:#4F46E5;background:#EEF2FF;border:1px solid #E0E7FF;padding:2px 7px;border-radius:6px">{{ badgeTxt }}</span></sc-if>
      </div>
    </sc-if>
    <div ref="{{ langWrapRef }}" style="position:relative;flex:none">
      <button onClick="{{ toggleLang }}" title="Языковая пара: язык текстов → язык подсказок" style="display:flex;align-items:center;gap:6px;border:1px solid #E5E7EB;background:#fff;border-radius:999px;padding:5px 11px;font-family:Inter,system-ui,sans-serif;font-size:12px;font-weight:600;color:#374151;cursor:pointer" style-hover="border-color:#C7D2FE;background:#FAFAFF">
        {{ pair }}
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
      <sc-if value="{{ langOpen }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;top:calc(100% + 8px);right:0;width:238px;background:#fff;border:1px solid #E5E7EB;border-radius:12px;box-shadow:0 10px 28px rgba(26,26,26,.09);padding:6px;z-index:70">
          <div style="font-size:10.5px;font-weight:600;letter-spacing:.09em;color:#9CA3AF;padding:8px 10px 6px">ЯЗЫКОВАЯ ПАРА</div>
          <sc-for list="{{ pairs }}" as="p" hint-placeholder-count="4">
            <button onClick="{{ p.pick }}" style="display:flex;align-items:center;gap:8px;width:100%;border:none;border-radius:8px;padding:8px 10px;background:{{ p.bg }};cursor:pointer;font-family:Inter,system-ui,sans-serif;text-align:left" style-hover="background:#F5F5F3">
              <span style="font-size:12.5px;font-weight:600;color:#1A1A1A;flex:none;white-space:nowrap">{{ p.label }}</span>
              <span style="font-size:11.5px;color:#9CA3AF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ p.note }}</span>
              <sc-if value="{{ p.active }}" hint-placeholder-val="{{ false }}">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-left:auto;flex:none"><polyline points="20 6 9 17 4 12"></polyline></svg>
              </sc-if>
            </button>
          </sc-for>
          <div style="font-size:11px;line-height:1.5;color:#9CA3AF;padding:8px 10px 6px;border-top:1px solid #F3F4F6;margin-top:4px">Пара — язык текстов → язык подсказок. Скоро добавим новые языки.</div>
        </div>
      </sc-if>
    </div>
    <div title="{{ syncTitle }}" style="display:flex;align-items:center;gap:6px;flex:none;cursor:default">
      <span style="width:8px;height:8px;border-radius:50%;background:{{ syncColor }}"></span>
      <span class="fsh-sync-label" style="font-size:11.5px;color:#6B7280">{{ syncLabel }}</span>
    </div>
    <a href="Fluenta Profile.dc.html" title="Анна · уровень B2 — открыть профиль" style="width:30px;height:30px;border-radius:50%;background:#EEF2FF;color:#4F46E5;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex:none;user-select:none;text-decoration:none" style-hover="background:#E0E7FF;color:#4338CA">А</a>
  </div>
</header>
<nav class="fl-tabbar" aria-label="Разделы">
  <div class="fl-tabbar-in">
    <a class="fl-tab {{ onLibrary }}" href="Fluenta Library v2.dc.html"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>Библиотека</a>
    <a class="fl-tab {{ onReader }}" href="Fluenta Reader.dc.html"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>Читалка</a>
    <a class="fl-tab {{ onVideo }}" href="Fluenta Video.dc.html"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="14" height="14" rx="2"></rect><path d="M22 8l-6 4 6 4z"></path></svg>Видео</a>
    <a class="fl-tab {{ onTutor }}" href="Fluenta Tutor.dc.html"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path><path d="M19 10v1a7 7 0 0 1-14 0v-1"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>Тьютор</a>
    <a class="fl-tab {{ onReview }}" href="Fluenta Review.dc.html"><span style="position:relative;display:inline-flex"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg><sc-if value="{{ hasDue }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;top:-5px;right:-13px;background:#4F46E5;color:#fff;font-size:9px;font-weight:600;border-radius:999px;padding:1.5px 5px;line-height:1.2;border:1.5px solid #FAFAF8">{{ due }}</span></sc-if></span>Повторение</a>
    <a class="fl-tab {{ onProfile }}" href="Fluenta Profile.dc.html"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>Профиль</a>
  </div>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:150},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;library&quot;,&quot;reader&quot;,&quot;video&quot;,&quot;tutor&quot;,&quot;review&quot;,&quot;career&quot;,&quot;progress&quot;,&quot;profile&quot;],&quot;default&quot;:&quot;library&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Навигация&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Контекст&quot;},&quot;badge&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Контекст&quot;},&quot;due&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:14,&quot;min&quot;:0,&quot;max&quot;:99,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Навигация&quot;},&quot;syncState&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;synced&quot;,&quot;syncing&quot;,&quot;offline&quot;],&quot;default&quot;:&quot;synced&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Статус&quot;},&quot;pair&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;EN → RU&quot;,&quot;DE → RU&quot;,&quot;ES → RU&quot;,&quot;FR → RU&quot;],&quot;default&quot;:&quot;EN → RU&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Статус&quot;}}">
class Component extends DCLogic {
  state = { open: false, pair: null };
  componentDidMount() {
    this._out = (e) => { if (this.state.open && this._wrap && !this._wrap.contains(e.target)) this.setState({ open: false }); };
    document.addEventListener('pointerdown', this._out, true);
    this._esc = (e) => { if (e.key === 'Escape' && this.state.open) this.setState({ open: false }); };
    document.addEventListener('keydown', this._esc);
  }
  componentWillUnmount() {
    document.removeEventListener('pointerdown', this._out, true);
    document.removeEventListener('keydown', this._esc);
  }
  renderVals() {
    const active = this.props.active || '';
    const on = (k) => (active === k ? 'on' : '');
    const pair = this.state.pair || this.props.pair || 'EN → RU';
    const due = Number(this.props.due != null ? this.props.due : 0) || 0;
    const S = {
      synced: ['#10B981', 'синхронизировано', 'Все изменения синхронизированы'],
      syncing: ['#4F46E5', 'синхронизация…', 'Синхронизируем изменения…'],
      offline: ['#F59E0B', 'офлайн', 'Офлайн — прогресс сохраняется на устройстве и синхронизируется, когда появится сеть']
    };
    const s = S[this.props.syncState] || S.synced;
    const PAIRS = [['EN → RU', 'английский → русский'], ['DE → RU', 'немецкий → русский'], ['ES → RU', 'испанский → русский'], ['FR → RU', 'французский → русский']];
    return {
      onLibrary: on('library'), onReader: on('reader'), onVideo: on('video'), onTutor: on('tutor'), onReview: on('review'), onCareer: on('career'), onProgress: on('progress'), onProfile: on('profile'),
      hasTitle: !!this.props.title, pageTitle: this.props.title || '',
      hasBadge: !!this.props.badge, badgeTxt: this.props.badge || '',
      hasDue: due > 0, due: String(due),
      pair, langOpen: this.state.open,
      toggleLang: () => this.setState((x) => ({ open: !x.open })),
      langWrapRef: (el) => { this._wrap = el; },
      pairs: PAIRS.map((p) => ({
        label: p[0], note: p[1], active: p[0] === pair,
        bg: p[0] === pair ? '#EEF2FF' : 'transparent',
        pick: () => this.setState({ pair: p[0], open: false })
      })),
      syncColor: s[0], syncLabel: s[1], syncTitle: s[2]
    };
  }
}
</script>
</body>
</html>
