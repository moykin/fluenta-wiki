include: package:flutter_lints/flutter.yaml

analyzer:
  # Строгий режим: неявные динамические типы и небезопасные приведения —
  # источник ошибок, которые всплывают только в рантайме.
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # CI запускается с --fatal-infos, поэтому всё, что здесь включено,
    # блокирует сборку.
    todo: ignore

  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - require_trailing_commas
    - sort_child_properties_last
    - unawaited_futures
    - use_super_parameters
