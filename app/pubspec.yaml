name: fluenta
description: "Fluenta — превращает то, что вы читаете, в то, что вы можете сказать"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^17.3.0
  flutter_riverpod: ^3.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Шрифты бандлятся в приложение, а не грузятся из сети: продукт
  # офлайн-first, и текст для чтения должен отрисовываться сразу, без
  # скачка шрифта при первом запуске.
  #
  # Оба шрифта — вариативные (variable), одним файлом на все начертания.
  # Лицензия OFL, копии лежат рядом в assets/fonts.
  fonts:
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4.ttf
        - asset: assets/fonts/SourceSerif4-Italic.ttf
          style: italic
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
