name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Еженедельно: уязвимости появляются в уже написанном коде,
    # поэтому проверять только на PR недостаточно.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  secrets:
    name: Утечки секретов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Полная история: секрет мог утечь в старом коммите.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL (Python)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Есть ли Python-код
        id: check
        run: |
          if [ -d backend/app ]; then echo "exists=true" >> "$GITHUB_OUTPUT";
          else echo "exists=false" >> "$GITHUB_OUTPUT"; echo "Python-кода ещё нет — пропускаю."; fi

      - uses: github/codeql-action/init@v3
        if: steps.check.outputs.exists == 'true'
        with:
          languages: python
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        if: steps.check.outputs.exists == 'true'

  dependencies:
    name: Уязвимости в зависимостях
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2
        continue-on-error: true
        with:
          scan-args: |-
            --recursive
            --skip-git
            ./

  filesystem:
    name: Trivy — конфигурация и зависимости
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
