name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "infra/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Куда выкатывать"
        required: true
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read

jobs:
  build:
    name: Собрать образ
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      skipped: ${{ steps.check.outputs.exists == 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: Есть ли что собирать
        id: check
        run: |
          if [ -f backend/Dockerfile ]; then echo "exists=true" >> "$GITHUB_OUTPUT";
          else echo "exists=false" >> "$GITHUB_OUTPUT"; echo "Backend ещё не создан — деплой пропускается."; fi

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.exists == 'true'

      - name: Логин в GHCR
        if: steps.check.outputs.exists == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Теги образа
        id: meta
        if: steps.check.outputs.exists == 'true'
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Сборка и публикация
        if: steps.check.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fluenta-api:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/fluenta-api:${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'prod' && 'latest' || 'main' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Проверить образ на уязвимости
        if: steps.check.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/fluenta-api:${{ steps.meta.outputs.tag }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  deploy:
    name: Выкатить на ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
    needs: build
    if: needs.build.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    # Прод-окружение защищено правилом ручного подтверждения в настройках
    # репозитория: выкатка в прод не происходит без явного нажатия.
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Скопировать конфигурацию на сервер
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "infra/docker-compose.yml,infra/Caddyfile,infra/postgres-init/*"
          target: /opt/fluenta
          strip_components: 1

      - name: Обновить сервис и применить миграции
        uses: appleboy/ssh-action@v1.2.0
        env:
          TAG: ${{ needs.build.outputs.tag }}
          TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: TAG,TARGET
          script: |
            set -euo pipefail
            cd /opt/fluenta

            if [ "$TARGET" = "prod" ]; then SERVICE=api-prod; VAR=PROD_TAG; else SERVICE=api-dev; VAR=DEV_TAG; fi

            # Запомнить текущий тег для отката.
            grep "^${VAR}=" .env > .env.previous || true

            # Подставить новый тег.
            sed -i "s|^${VAR}=.*|${VAR}=${TAG}|" .env

            docker compose pull "$SERVICE"
            docker compose run --rm "$SERVICE" alembic upgrade head
            docker compose up -d "$SERVICE" caddy

            # Дождаться, пока сервис станет здоровым, иначе — откат.
            for i in $(seq 1 30); do
              if docker compose ps "$SERVICE" --format '{{.Health}}' | grep -q healthy; then
                echo "Сервис здоров."; exit 0
              fi
              sleep 5
            done

            echo "Сервис не поднялся — откатываюсь." >&2
            if [ -s .env.previous ]; then
              sed -i "s|^${VAR}=.*|$(cat .env.previous)|" .env
              docker compose up -d "$SERVICE"
            fi
            exit 1

      - name: Проверить, что снаружи отвечает
        env:
          TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
        run: |
          if [ "$TARGET" = "prod" ]; then URL=https://api.fluenta.wiki/healthz; else URL=https://api-dev.fluenta.wiki/healthz; fi
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$URL" || true)
            # Dev закрыт basic auth — 401 тоже означает, что сервис жив.
            if [ "$code" = "200" ] || [ "$code" = "401" ]; then echo "OK ($code)"; exit 0; fi
            sleep 6
          done
          echo "Сервис снаружи не отвечает" >&2; exit 1
