version: 2

updates:
  # Сами GitHub Actions — самая частая точка компрометации CI.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, backend]
    groups:
      # Патчи и минорные — одним PR, чтобы не тонуть в шуме.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, app]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pub
    directory: /marketing
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, marketing]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, docker]
