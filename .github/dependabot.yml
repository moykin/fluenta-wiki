version: 2

# ВАЖНО: экосистему подключаем ТОЛЬКО когда в её директории реально есть
# файл манифеста. Dependabot не умеет «подождать» — он сразу пытается
# разобрать зависимости, не находит их и падает с ошибкой, засыпая почту
# уведомлениями. Блоки ниже раскомментировать по мере появления кода.

updates:
  # Сами GitHub Actions — самая частая точка компрометации CI.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]

